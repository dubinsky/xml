pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  // A parent build has already included this directory; Gradle rejects a second include.
  if (gradle.parent == null) {
    // Pass a String to pluginManagement.includeBuild. A File hits Settings.includeBuild
    // (regular composite) and settings plugins are not visible.
    final String conventionsDir =
      providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
    if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
      includeBuild conventionsDir
    }
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.3.0'
}

rootProject.name = 'org.podval.xml'
