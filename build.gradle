plugins {
  id 'java-library'
  id 'scala'
  id 'maven-publish'
  id 'signing'
  id 'io.github.ben-manes.versions' version '0.61.0'
  id 'org.podval.tools.scalajs' version '1.0.4'
}

description = 'XML AST, codecs, named catalogs, and store path model'
group = 'org.podval'
version = '0.0.1'

final String gitHubRepository = 'dubinsky/xml'
final String gitHubRepositoryUrl = "https://github.com/$gitHubRepository"
final String orgName = 'Podval Group'
final String orgUrl = 'https://www.podval.org'

scala.scalaVersion = '3.9.0'

// Maven Central wants a -javadoc jar; this project is Scala-only, so package scaladoc.
tasks.register('javadocJar', Jar) {
  from scaladoc
  archiveClassifier = 'javadoc'
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(25)
  withSourcesJar()
  withJavadocJar()
}

tasks.named('jar', Jar) {
  manifest {
    attributes(
      'Implementation-Title'  : project.name,
      'Implementation-Version': archiveVersion,
      'Implementation-Vendor' : orgName
    )
  }
}

String zioBlocksVersion = '0.0.51'

dependencies {
  api "dev.zio:zio-blocks-schema_3:$zioBlocksVersion"
  api "dev.zio:zio-blocks-schema-xml_3:$zioBlocksVersion"
  compileOnlyApi "dev.zio:zio-blocks-html_3:$zioBlocksVersion"
  testImplementation "dev.zio:zio-blocks-html_3:$zioBlocksVersion"
  compileOnlyApi 'org.scala-lang.modules:scala-xml_3:2.4.0'
  testImplementation 'org.scala-lang.modules:scala-xml_3:2.4.0'
  compileOnly 'org.ccil.cowan.tagsoup:tagsoup:1.2.1'
  testImplementation 'org.ccil.cowan.tagsoup:tagsoup:1.2.1'
  implementation 'org.typelevel:paiges-core_3:0.4.4'
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

def isNonStable = { String version ->
  boolean stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  String regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

// Maven has zio-blocks-schema_3:0.017 (a padded 0.0.17), which both Maven and Gradle
// rank above 0.0.x because the second component is 17.
def hasPaddedNumericComponent = { String version ->
  version.tokenize('.-').any { it.length() > 1 && it ==~ /0\d+/ }
}

tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version) || hasPaddedNumericComponent(it.candidate.version)
  }
}

tasks.withType(ScalaCompile).configureEach {
  scalaCompileOptions.with {
    additionalParameters = [
      '-new-syntax',
      '-feature',
      '-language:strictEquality',
      '-source:future'
    ]
  }
}

publishing {
  publications {
    library(MavenPublication) {
      from components.java

      pom {
        name = 'Podval XML'
        description = project.description
        url = gitHubRepositoryUrl
        inceptionYear = '2026'
        scm {
          url = gitHubRepositoryUrl
          connection = "scm:git:https://github.com/${gitHubRepository}.git"
          developerConnection = "scm:git:ssh://git@github.com/${gitHubRepository}.git"
        }
        issueManagement {
          system = 'GitHub'
          url = "$gitHubRepositoryUrl/issues"
        }
        licenses {
          license {
            name = 'Apache-2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
          }
        }
        organization {
          name = orgName
          url = orgUrl
        }
        developers {
          developer {
            id = 'dub'
            name = 'Leonid Dubinsky'
            email = 'dub@podval.org'
            url = 'https://dub.podval.org'
            organization = orgName
            organizationUrl = orgUrl
            timezone = '-5'
          }
        }
      }
    }
  }
}

signing {
  useInMemoryPgpKeys(
    findProperty('signingKey') as String,
    findProperty('signingPassword') as String
  )
  sign publishing.publications.library
}
