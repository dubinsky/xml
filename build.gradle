plugins {
  id 'java-library'
  id 'scala'
  id 'maven-publish'
  id 'signing'
  id 'org.podval.conventions'
  id 'org.podval.conventions.publish'
  id 'org.podval.tools.scalajs' version '1.0.4'
}

description = 'XML AST, codecs, named catalogs, and store path model'
group = 'org.podval'

podvalPublish {
  gitHubRepository = 'dubinsky/xml'
  name = 'Podval XML'
  inceptionYear = '2026'
}

String zioBlocksVersion = '0.0.51'
String scalaXmlVersion = '2.5.0'
String tagsoupVersion = '1.2.1'

dependencies {
  api "dev.zio:zio-blocks-schema_3:$zioBlocksVersion"
  api "dev.zio:zio-blocks-schema-xml_3:$zioBlocksVersion"
  compileOnly "dev.zio:zio-blocks-html_3:$zioBlocksVersion"
  testImplementation "dev.zio:zio-blocks-html_3:$zioBlocksVersion"
  compileOnly "org.scala-lang.modules:scala-xml_3:$scalaXmlVersion"
  testImplementation "org.scala-lang.modules:scala-xml_3:$scalaXmlVersion"
  compileOnly "org.ccil.cowan.tagsoup:tagsoup:$tagsoupVersion"
  testImplementation "org.ccil.cowan.tagsoup:tagsoup:$tagsoupVersion"
  implementation 'org.typelevel:paiges-core_3:0.4.4'
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}

// GitHub renders README.adoc as committed; Gradle cannot substitute at view time.
def expectedReadmeCoordinate = "org.podval:org.podval.xml:${version}"
def checkReadmeVersion = tasks.register('checkReadmeVersion') {
  group = 'verification'
  description = 'Fails if README.adoc Maven coordinates do not match project.version.'
  def readmeFile = file('README.adoc')
  inputs.file(readmeFile)
  inputs.property('expected', expectedReadmeCoordinate)
  doLast {
    def found = (readmeFile.getText('UTF-8') =~ /org\.podval:org\.podval\.xml:[0-9][0-9A-Za-z._-]*/).findAll().toSet()
    if (found != [expectedReadmeCoordinate] as Set) {
      throw new GradleException("README.adoc Maven coordinates ${found} must all be ${expectedReadmeCoordinate}")
    }
  }
}
tasks.named('check') { dependsOn(checkReadmeVersion) }
